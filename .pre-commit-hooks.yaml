- id: commitizen
  name: commitizen check
  description: >
    Check whether the current commit message follows commiting rules. Allow
    empty commit messages by default, because they typically indicate to Git
    that the commit should be aborted.
  entry: cz check
  args: [--allow-abort, --commit-msg-file]
  stages: [commit-msg]
  language: python
  language_version: python3
- id: lint
  name: lint
  entry: make
  args: ["lint", "COMMIT_HOOK=1"]
  pass_filenames: false
  language: python
  stages: [pre-commit]
- id: format_mdj
  name: format_mdj
  entry: make
  args: ["format_mdj"]
  pass_filenames: false
  language: python
  stages: [pre-commit]
- id: check_commit_msg
  name: check commit message
  description: checks commit message for issue number and typos.
  entry: check_commit_msg
  language: python
  stages: [commit-msg]
- id: check_uv_toml
  name: lint pyproject.toml
  description: checks pyproject.toml files for parseable syntax path dependency.
  entry: check_uv_toml
  language: python
  types: [toml]
  files: pyproject.toml
  stages: [pre-commit]
- id: check_branch_name
  name: check branch name
  description: checks if the current git branch name follows the naming convention.
  entry: check_branch_name
  language: python
  stages: [pre-commit]
- id: oxlint
  name: run oxlint
  description: run oxlint on staged JS/TS files.
  entry: pnpm oxlint
  language: system
  stages: [pre-commit]
  files: \.(js|jsx|mjs|cjs|ts|tsx)$
  require_serial: true
- id: stylelint
  name: run stylelint
  description: run stylelint:staged on staged CSS/SCSS/TSX files.
  entry: pnpm stylelint:staged --
  language: system
  stages: [pre-commit]
  files: \.(css|scss|tsx)$
  require_serial: true
- id: rumdl
  name: run rumdl
  description: run rumdl for documentation markdown files.
  entry: pnpm rumdl --
  language: system
  stages: [pre-commit]
  files: ^docs/.*\.(md|mdx)$
  require_serial: true
- id: oxfmt
  name: run oxfmt
  description: run oxfmt on staged source and json files.
  entry: pnpm oxfmt --
  language: system
  stages: [pre-commit]
  files: \.(js|mjs|cjs|ts|tsx|json)$
  require_serial: true
- id: typos
  name: run typos
  description: run typos spell checker on staged files.
  entry: typos
  language: python
  stages: [pre-commit]
